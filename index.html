+'<div class="rate" id="play"><div class="row"><span id="slbl" style="font-size:14px;color:var(--mute)"></span><span><span class="big" id="sv"></span> <span id="sd" style="font-size:13px;font-weight:700"></span></span></div><input type="range" id="sl" min="3.5" max="8" step="0.25" value="'+st.sl+'" aria-label="BI rate"><div class="rng"><span>3,50%</span><span>8,00%</span></div><div id="fxl" style="font-size:13px;color:var(--mute);margin-bottom:6px"></div><div class="fxrow" id="fxrow"></div><button class="pill" id="go">'+T.go+'</button></div>'
+'<div id="meters" style="margin-bottom:10px"></div><details class="card" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700;font-size:14px">'+T.hist+'</summary><div class="lg" id="lg" style="margin-top:10px"></div><div id="chart"></div></details><div class="info" id="info" hidden></div><div id="end"></div></div>';
updAll();startWander()}
function updRate(){var T=S[L],sr=st.sl,dr=sr-st.rate;g('slbl').innerHTML=tt(T.set);g('sv').textContent=fm(sr,2)+'%';var d=g('sd');d.textContent=Math.abs(dr)<0.01?'':(dr>0?'+':'-')+fm(Math.abs(dr),2);d.style.color=dr>0?'var(--bad)':'var(--good)';g('play').hidden=st.over}
function updFx(){var T=S[L];g('fxl').innerHTML=tt(T.fxLbl);g('fxrow').innerHTML=[[0,T.fxN],[1,T.fxS],[2,T.fxB]].map(function(c){var off=c[0]&&st.R<FX.cost[c[0]];return '<button class="fxb'+(st.fx===c[0]?' on':'')+(off?' off':'')+'" data-lv="'+c[0]+'">'+c[1]+'<small>'+(c[0]?'-'+FX.cost[c[0]]:'0')+'</small></button>'}).join('')}
function delta(cur,prev,badUp,d){if(!prev&&prev!==0)return '';var x=cur-prev;if(Math.abs(x)<Math.pow(10,-d)/2)return '';var up=x>0,bad=badUp===null?null:(up===badUp),col=bad===null?'var(--mute)':bad?'var(--bad)':'var(--good)';return '<span style="font-size:11px;font-weight:700;color:'+col+'">'+(up?'&uarr;':'&darr;')+fm(Math.abs(x),d)+'</span>'}
var wtok=0;
function MOODN(v){return v<45?0:v<70?1:2}
function stageHTML(){var T=S[L],cols='',infs='';for(var i=0;i<3;i++){
cols+='<div class="col" data-i="'+i+'" id="col'+i+'" tabindex="0" role="button" aria-label="'+T.names[i]+'"><div class="sb sb0" id="sb'+i+'"></div><div class="mv" id="mv'+i+'"><div class="jp" id="jp'+i+'"><div class="fig" id="fg'+i+'"></div></div></div><div class="shd"></div></div>';
infs+='<div class="ic" data-i="'+i+'" id="ic'+i+'" tabindex="0" role="button"><div class="tx"><div class="nm">'+T.names[i]+'</div><div class="sm" id="sm'+i+'"></div><div class="bar"><div id="bar'+i+'"></div></div></div></div>'}
return '<div class="stage"><div class="sky"><div class="cols">'+cols+'</div></div><div class="infr">'+infs+'</div></div>'}
function updStage(){var T=S[L],pvs=st.over?st.s:sAt(st.sl,true);st.mo=[];
for(var i=0;i<3;i++){var v=pvs[i],m=MOODN(v);st.mo.push(m);var fg=g('fg'+i);
if(fg.getAttribute('data-m')!==String(m)){fg.setAttribute('data-m',m);fg.className='fig m'+m;fg.innerHTML=body(i,m,128)}
var sb=g('sb'+i),tx=T.say[i][m];if(i===2&&m>0&&!st.over){var gd2=3*(sAtRp()-13550)/100+0.2*(100-st.R),gr2=14*(st.sl-4.25);if(gd2>Math.max(gr2,0))tx=T.say2[m-1]}
if(sb.getAttribute('data-t')!==tx){sb.setAttribute('data-t',tx);sb.className='sb sb'+m+' pb';sb.textContent=tx;talk(i)}else sb.className='sb sb'+m;
var dl=Math.round(v-st.s[i]),ar=dl>=1?' <span style="color:var(--bad)">&uarr;'+dl+'</span>':dl<=-1?' <span style="color:var(--good)">&darr;'+Math.abs(dl)+'</span>':'';
g('sm'+i).innerHTML=T.stress+' '+Math.round(v)+ar;
var br=g('bar'+i);br.style.width=v+'%';br.style.background=['var(--good)','var(--orange)','var(--bad)'][m];
g('col'+i).className='col'+(st.sel===i?' sel':'');g('ic'+i).className='ic'+(st.sel===i?' sel':'');
if(st.fresh&&st.pS){var dv=v-st.pS[i],cls=dv<=-1?'hop':dv>=1?'shk':'',jp=g('jp'+i);jp.className='jp';if(cls){void jp.offsetWidth;jp.className='jp '+cls}}}
g('why').className='why'+(st.sel===null?' hint':'');g('why').innerHTML=st.sel!==null?'<b>'+T.names[st.sel]+'</b>: '+whyText(st.sel):T.whyHint}
var tiltT=null;
function tilt(e){var any=false;for(var i=0;i<3;i++){var f=g('fg'+i);if(!f)continue;any=true;var r=f.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*0.35,dx=(e.clientX-cx)/Math.max(160,innerWidth*0.5),dy=(e.clientY-cy)/Math.max(160,innerHeight*0.5);dx=Math.max(-1,Math.min(1,dx));dy=Math.max(-1,Math.min(1,dy));f.style.setProperty('--ry',(dx*13).toFixed(1)+'deg');f.style.setProperty('--rx',(-dy*6).toFixed(1)+'deg')}
if(!any)return;clearTimeout(tiltT);if(e.pointerType==='touch'||e.pointerType==='pen')tiltT=setTimeout(tiltReset,1400)}
function tiltReset(){for(var i=0;i<3;i++){var f=g('fg'+i);if(f){f.style.setProperty('--ry','0deg');f.style.setProperty('--rx','0deg')}}}
document.addEventListener('pointermove',tilt);document.addEventListener('pointerdown',tilt);
document.addEventListener('pointerleave',tiltReset);
function wander(i,tok){if(tok!==wtok)return;var el=g('mv'+i),fg=g('fg'+i);if(!el||!fg)return;var m=(st&&st.mo&&st.mo[i])||0,amp=m===2?8:m===1?6:5,dx=(Math.random()*2-1)*amp,dur=m===2?0.35:1.6;el.style.transitionDuration=dur+'s';el.style.transform='translateX('+dx.toFixed(1)+'px) rotate('+(dx/amp*(m===2?5:3)).toFixed(1)+'deg)';
if(m===0&&Math.random()<0.4)talk(i);if(m===0&&Math.random()<0.25){var jp=g('jp'+i);if(jp){jp.className='jp';void jp.offsetWidth;jp.className='jp hop'}}
setTimeout(function(){wander(i,tok)},m===2?450+Math.random()*350:2200+Math.random()*2400)}
function startWander(){wtok++;try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}var t=wtok;for(var i=0;i<3;i++)(function(i){setTimeout(function(){wander(i,t)},400+i*500)})(i)}
function line(a,lo,hi,c,dash){var pts=a.map(function(v,i){return (28+i*(352/11)).toFixed(1)+','+(130-cl((v-lo)/(hi-lo),0,1)*110).toFixed(1)}).join(' ');var last=a.length-1,ly=(130-cl((a[last]-lo)/(hi-lo),0,1)*110).toFixed(1),lx=(28+last*(352/11)).toFixed(1);return '<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/><circle cx="'+lx+'" cy="'+ly+'" r="3.2" fill="'+c+'"/>'}
function chart(){var T=S[L],y1=130-4.5/8*110,y2=130-2.5/8*110,cols=['var(--bad)','var(--good)','#378ADD','var(--mute)','#8B7FD6'];
g('lg').innerHTML=cols.map(function(c,i){return '<span><i style="background:'+c+'"></i>'+T.legend[i]+'</span>'}).join('')+'<span><i style="background:var(--orange);opacity:.35"></i>'+T.legend[5]+'</span>';
var ax='';for(var i=0;i<=12;i+=3)ax+='<text x="'+(28+i*(352/11)).toFixed(0)+'" y="146" font-size="10" text-anchor="middle" fill="var(--mute)">'+i+'</text>';
var gd='';for(var k=0;k<=2;k++)gd+='<line x1="28" x2="380" y1="'+(20+k*55)+'" y2="'+(20+k*55)+'" stroke="var(--line)" stroke-width="1"/>';
g('chart').innerHTML='<svg width="100%" viewBox="0 0 400 152" role="img" aria-label="history chart">'+gd+'<rect x="28" y="'+y1.toFixed(1)+'" width="352" height="'+(y2-y1).toFixed(1)+'" fill="var(--orange)" opacity=".22"/>'+line(st.H.i,0,8,cols[0])+line(st.H.r,12500,16500,cols[1])+line(st.H.g,2,7,cols[2])+line(st.H.b,0,8,cols[3],true)+line(st.H.f,0,8,cols[4],true)+ax+'</svg>'}
function confetti(){var c=['#E2762B','#6B7F2C','#378ADD','#EF9F27','#8B7FD6','#D4537E'],s='';for(var i=0;i<28;i++)s+='<span class="cf" style="left:'+Math.round(Math.random()*96)+'%;background:'+c[i%6]+';animation-delay:'+(Math.random()*0.8).toFixed(2)+'s;border-radius:'+(i%3?'1px':'50%')+'"></span>';return s}
function updAll(){var T=S[L],done=st.over;
g('hdr').textContent=T.gov+' '+pname+(done?'':' · '+T.turn+' '+st.t+'/12');
var pg='';for(var q=1;q<=12;q++)pg+='<i class="'+(q<st.t||done?'d':q===st.t?'c':'')+'"></i>';g('prog').innerHTML=pg;
g('crisis').innerHTML=st.cr.map(function(i){return '<div class="cr">'+T.crisis[i]+'</div>'}).join('');
g('last').innerHTML=st.msg?T.msg(st.msg):'';g('last').hidden=!st.msg;
var e=E[st.t];g('ev').innerHTML=done?'':'<div class="ev '+(e?(e==='boom'?'gd':'bad'):'')+'"><div class="ci">'+ic(e?EI[e]:'sun',22)+'</div><span class="tx">'+(e?tt(T.ev[e]):T.noev)+'</span></div>';
updRate();updFx();
var ic1=st.infl>=2.5&&st.infl<=4.5,gc=st.gr>=5.0,gp=st.rate-st.us,pv=st.fresh?st.pv:null,pp=st.fresh?'pop':'';
var ms=[['cart',T.mI,fm(st.infl,1)+'%',ic1,pv?delta(st.infl,pv.infl,true,1):'',''],['coin',T.mR,rpf(st.rp),st.rp<15200,pv?delta(st.rp,pv.rp,true,0):'',''],['chart',T.mG,fm(st.gr,1)+'%',gc,pv?delta(st.gr,pv.gr,false,1):'',''],['bank',T.mF,fm(st.us,2)+'%',null,pv?delta(st.us,pv.us,null,2):'','<div class="n" style="color:'+(gp>=3.5?'var(--good)':'var(--bad)')+'">'+T.gap(gp)+'</div>']];
var rcol=st.R<40?'var(--bad)':st.R<70?'var(--orange)':'var(--good)',
rc='<div class="rsv"><span class="l">'+T.resL+'</span><div class="bar"><div style="width:'+st.R+'%;background:'+rcol+'"></div></div><span class="v2" style="color:'+rcol+'">'+Math.round(st.R)+(pv?' '+delta(st.R,pv.R,false,0):'')+'</span></div>'+(st.R<40?'<div style="font-size:11px;color:var(--bad);margin-top:6px">'+T.resLow+'</div>':'');
var mcell=ms.map(function(x,ix){var val=ix===1?Math.round(st.rp).toLocaleString(L==='id'?'id-ID':'en-US'):x[2],d=ix===3?'<span style="color:'+(gp>=3.5?'var(--good)':'var(--bad)')+'">'+T.gapS+' '+fm(gp,2)+'</span>':(x[4]||'');return '<div class="mc2"><div class="l">'+(ix===1?'Rupiah/USD':ix===3?(L==='id'?'The Fed':'US Fed'):x[1])+'</div><div class="v" style="color:'+(x[3]===null?'var(--ink)':x[3]?'var(--good)':'var(--bad)')+'"><span class="'+pp+'">'+val+'</span></div><div class="d">'+d+'</div></div>'}).join('');
g('meters').innerHTML='<div class="mcard"><div class="m4">'+mcell+'</div>'+rc+'</div>';
updStage();chart();
g('info').innerHTML=selTerm?'<b>'+selTerm[0]+'</b>: '+selTerm[1]:T.tip;
var k=ending(),sc=st.okI*4+st.okG*3+st.okR*3,win=k==='legend'||k==='infl'||k==='growth';
g('end').innerHTML=done?'<div class="endc">'+(win&&st.fresh?confetti():'')+'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-size:12px;color:var(--mute)">'+T.score+' · '+T.gov+' '+esc(pname)+'</div><div style="font-size:36px;font-weight:800;line-height:1.1">'+sc+'<span style="font-size:14px;color:var(--mute);font-weight:500">/120</span></div></div><div style="color:'+(win?'var(--orange)':'var(--mute)')+'">'+ic(win?'trophy':'award',48)+'</div></div><div style="font-size:20px;font-weight:800;margin:10px 0 4px">'+T.end[k][0]+'</div><div style="font-size:14px;margin-bottom:10px">'+T.end[k][1]+'</div><div style="font-size:14px;line-height:1.8">'+T.s1+': <b>'+st.okI+'/12</b><br>'+T.s2+': <b>'+st.okG+'/12</b><br>'+T.s5+': <b>'+st.okR+'/12</b><br>'+T.s3+': <b>'+rpf(st.rp)+'</b><br>'+T.s4+': <b>'+Math.round(st.R)+'/100</b></div><div style="font-size:13px;color:var(--mute);margin:10px 0 14px">'+T.real+'</div>'+bestHTML(sc,T)+'<button class="pill" id="share" style="background:var(--card);color:var(--ink);border:2px solid var(--olive);margin-bottom:10px">'+T.share+'</button><button class="pill" id="again">'+T.again+'</button></div>':''}
document.addEventListener('click',function(ev){var t=ev.target,b;
if(b=t.closest('[data-tab]')){tab=b.getAttribute('data-tab');snd('pick');render();window.scrollTo(0,0);return}
if(t.closest('#bmus')){mus=!mus;if(mus)musStart();else musStop();t.closest('#bmus').style.opacity=mus?1:0.4;return}
if(t.closest('#bsnd')){mute=!mute;if(!mute){ac();snd('pick')}t.closest('#bsnd').innerHTML=ic(mute?'volo':'vol',18);return}
if(t.closest('#blang')){L=L==='id'?'en':'id';selTerm=null;render();return}
if(t.closest('#start')){var v=g('nm').value.trim();if(!v){g('nerr').textContent=S[L].nameErr;g('nm').focus();return}pname=v;try{localStorage.setItem('bi_name',v)}catch(e){}ac();snd('pick');newGame();phase='play';render();window.scrollTo(0,0);return}
if(t.closest('#tipx')){g('tip').hidden=true;return}
if(t.closest('#bx')){snd('pick');phase='home';render();window.scrollTo(0,0);return}
if(b=t.closest('#share')){snd('pick');doShare(b);return}
if(t.closest('#again')){snd('pick');newGame();buildPlay();window.scrollTo(0,0);return}
if(t.closest('#go')){step();return}
if(b=t.closest('.fxb')){var lv=parseInt(b.getAttribute('data-lv'),10);if(lv&&st.R<FX.cost[lv]){showTip([S[L].resL,S[L].fxNo]);return}st.fx=lv;snd('pick');updFx();return}
if(b=t.closest('.stage [data-i]')){var i=parseInt(b.getAttribute('data-i'),10);st.sel=st.sel===i?null:i;snd('pick');updStage();return}
if(b=t.closest('.term')){var k=b.getAttribute('data-k'),d=S[L].terms[k],gi=GL[d[1]];selTerm=[d[0],gi[L==='id'?2:3]];g('info').innerHTML='<b>'+selTerm[0]+'</b>: '+selTerm[1];showTip(selTerm)}});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='nm'){g('start').click()}if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&(ev.target.classList.contains('ic')||ev.target.classList.contains('col'))){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',function(ev){var t=ev.target;
if(t.id==='sl'){st.sl=parseFloat(t.value);st.fresh=false;snd('tick',st.sl);updRate();updStage()}
if(t.id==='nm'){pname=t.value;g('nerr').textContent='';g('gn').textContent=pname}
if(t.id==='gq'){glq=t.value;fillGloss()}});
render();
</script>
